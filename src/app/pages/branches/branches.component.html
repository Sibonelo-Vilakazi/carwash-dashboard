<div class="header bg-gradient-danger pb-8 pt-5 pt-md-8">
    <div class="row">
      <div *ngIf="progressStats" class="row col-lg-12 mb-2 pr-5 pl-5">
        <div *ngFor="let item of progressStatusCardConfig" class="col-xl-3 mb-2 col-lg-6">
          <div class="card card-stats mb-4 mb-xl-0">
            <div class="card-body">
              <div class="row">
                <div class="col">
                  <h5 class="card-title text-uppercase text-muted mb-0">{{item.name}}</h5>
                  <span class="h2 font-weight-bold mb-0">{{item.stats}}</span>
                </div>
                <div class="col-auto">
                  <div class="icon icon-shape {{item.color}} text-white rounded-circle shadow">
                    <i class="{{item.icon}}"></i>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-12 text-right pr-5">
        <button (click)="handleAddBranch()" class="btn p-3 btn-sm btn-primary">
          <i class="fas fa-plus-circle mr-2"></i>
          Add Branch
        </button>
      </div>
    </div>
  </div>
  
  <div class="container-fluid mt--7">
    <!-- Branches Table -->
    <div class="row">
      <div class="col">
        <div class="card shadow">
          <div class="card-header border-0">
            <h3 class="mb-0">Car Wash Branches</h3>
          </div>
          <div class="table-responsive">
            <table class="table align-items-center table-flush">
              <thead class="thead-light">
                <tr>
                  <th scope="col">Branch Name</th>
                  <th scope="col">Location</th>
                  <th scope="col">Start Time</th>
                  <th scope="col">End Time</th>
                  <th scope="col">Status</th>
                  <th scope="col">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let branch of branches; let i = index">
                  <th scope="row">
                    <div class="media align-items-center">
                      <div class="media-body">
                        <span class="mb-0 text-sm">{{branch.name}}</span>
                      </div>
                    </div>
                  </th>
                  <td>{{branch.location}}</td>
                  <td>{{branch.startTime}}</td>
                  <td>{{branch.endTime}}</td>
                  <td>
                    <div *ngIf="branch.status" class="col text-right">
                      <a href="#!" class="btn btn-success">Active</a>
                    </div>
                    <div *ngIf="!branch.status" class="col text-right">
                      <a href="#!" class="btn btn-danger">Deactivatd</a>
                    </div>
                  </td>
                  <td class="text-right">
                    <div ngbDropdown placement="bottom-right">
                      <a class="btn btn-sm btn-icon-only text-light" ngbDropdownToggle>
                        <i class="fas fa-ellipsis-v"></i>
                      </a>
                      <div ngbDropdownMenu class="dropdown-menu-right dropdown-menu-arrow">
                        <a class="dropdown-item" (click)="handleEditBranch(branch.id)">Edit</a>
                        <a class="dropdown-item" (click)="handleDeleteBranch(branch.id)">Delete</a>
                      </div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="card-footer py-4">
            <nav aria-label="...">
              <ul class="pagination justify-content-end mb-0">
                <li class="page-item disabled">
                  <a class="page-link" href="javascript:void(0)" tabindex="-1">
                    <i class="fas fa-angle-left"></i>
                    <span class="sr-only">Previous</span>
                  </a>
                </li>
                <li class="page-item active">
                  <a class="page-link" href="javascript:void(0)">1</a>
                </li>
                <li class="page-item">
                  <a class="page-link" href="javascript:void(0)">2</a>
                </li>
                <li class="page-item">
                  <a class="page-link" href="javascript:void(0)">
                    <i class="fas fa-angle-right"></i>
                    <span class="sr-only">Next</span>
                  </a>
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </div>
    </div>
  </div>
