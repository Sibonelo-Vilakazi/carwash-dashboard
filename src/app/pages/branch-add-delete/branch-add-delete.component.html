<div class="header pb-8 pt-5 pt-lg-8 d-flex align-items-center" style="min-height: 600px; background-image: url(assets/img/theme/profile-cover.jpg); background-size: cover; background-position: center top;">
    <!-- Mask -->
    <span class="mask bg-gradient-danger opacity-8"></span>
    <!-- Header container -->
    
  </div>

  <div class="container-fluid mt--7">
    <div class="row">
      
      <div class="col-xl-12 order-xl-1">
        <div class="card bg-secondary shadow">
          <div class="card-header bg-white border-0">
            <div class="row align-items-center">
              <div class="col-8">
                <h3 class="mb-0">Branch</h3>
              </div>
              
            </div>
          </div>
          <div class="card-body">
            <form [formGroup]="branchForm">
              <h6 class="heading-small text-muted mb-4">Branch information</h6>
              <div class="pl-lg-4">
                <div class="row">
                  <div class="col-lg-4">
                    <div class="form-group">
                      <label class="form-control-label" for="input-username">Name</label>
                      <input type="text" id="input-username" formControlName="name"  class="form-control form-control-alternative" placeholder="Name">
                    </div>
                  </div>
                  <div class="col-lg-4">
                    <div class="form-group">
                      <label class="form-control-label" for="input-price">Location</label>
                      <input type="text" formControlName="location" id="input-price" class="form-control form-control-alternative" placeholder="Location">
                    </div>
                  </div>
                  <div class="col-lg-2">
                    <div class="form-group">
                      <label class="form-control-label" for="input-username">Start Time</label>
                      <input type="text" id="input-username" formControlName="startTime"  class="form-control form-control-alternative" placeholder="Operation Start">
                    </div>
                  </div>

                  <div class="col-lg-2">
                    <div class="form-group">
                      <label class="form-control-label" for="input-username">End Time</label>
                      <input type="text" id="input-username" formControlName="endTime"  class="form-control form-control-alternative" placeholder="Operation Start">
                    </div>
                  </div>
                  
                  <div *ngIf="servicePackages && servicePackages.length > 0" class="col-lg-{{columnNumber}}">
                    <div class="form-group">
                      <label class="form-control-label" for="input-username">Select Package</label>
                        <div *ngFor="let item of servicePackages">{{item.name}}</div>
                      <!-- <select [disabled]="isEdit" (change)="handleChange($event.target.value)"class="custom-select" id="inputGroupSelect02">
                        <option *ngIf="!isEdit" disabled selected>Choose Package...</option>
                        <option [selected]="(carWashBooking?.packageName ?? '') === item.name"  *ngFor="let item of servicePackages; let packageIndex = index" [value]="packageIndex">{{item.name}}</option>
                      </select> -->
                    </div>
                  </div>

                 
               
              </div>
              <hr class="my-4" />
              
              <div class="col-4 text-left">
                <button [disabled]="branchForm.invalid" (click)="isEdit ? handleUpdate() : handleCreate()"class="btn w-100 py-3 btn-sm btn-primary">
                  {{isEdit ? 'Update Branch' : 'Create Branch'}}</button>
              </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
